name: Test AI Issue Entrypoint

on:
  workflow_dispatch:

jobs:
  verify-entrypoint:
    runs-on: [self-hosted, linux, ai-engineer]
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - name: Verify workflow context
        run: |
          set -euo pipefail
          echo "workspace=$GITHUB_WORKSPACE"
          git branch --show-current
          test -f .github/workflows/ai-engineer.yml
          command -v agy
          agy --version
          agy -p "Create .ai-test/ENTRYPOINT_OK.txt containing exactly ENTRYPOINT_OK." \
            --add-dir "$GITHUB_WORKSPACE" \
            --output-format json
          test "$(cat .ai-test/ENTRYPOINT_OK.txt)" = "ENTRYPOINT_OK"
