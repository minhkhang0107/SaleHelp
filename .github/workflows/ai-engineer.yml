name: AI Engineering Team

on:
  issues:
    types:
      - labeled
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-engineer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'ai:auto' &&
        github.event.issue.state == 'open' &&
        github.event.issue.author_association == 'OWNER'
      )
    runs-on: [self-hosted, Linux, ai-engineer]
    timeout-minutes: 120

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and AGY
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(whoami)"
          echo "home=$HOME"
          echo "workspace=$GITHUB_WORKSPACE"
          command -v agy
          agy --version
          git status --short

      - name: Smoke test AGY workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-test
          mkdir -p .ai-test
          agy -p "Create exactly this file in the current workspace: .ai-test/AGY_OK.txt. Its content must be exactly AGY_OK. Do not use a scratch directory." \
            --add-dir "$GITHUB_WORKSPACE" \
            --output-format json
          test -f .ai-test/AGY_OK.txt
          test "$(cat .ai-test/AGY_OK.txt)" = "AGY_OK"

      - name: Comment on Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$GITHUB_EVENT_ISSUE_NUMBER" --body "✅ AI Engineering Team entrypoint is working on the self-hosted runner. AGY successfully edited the repository workspace."
