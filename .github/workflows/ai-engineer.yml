name: AI Engineering Team

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to test
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-engineer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'ai:auto' &&
        github.event.issue.state == 'open' &&
        github.event.issue.user.login == 'minhkhang0107'
      )
    runs-on: [self-hosted, Linux, ai-engineer]
    timeout-minutes: 120

    env:
      ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.issue_number || github.event.issue.number }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and AGY
        shell: bash
        run: |
          set -euo pipefail
          echo "user=$(whoami)"
          echo "home=$HOME"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "issue=$ISSUE_NUMBER"
          command -v agy
          agy --version
          git status --short

      - name: Smoke test AGY workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-test
          mkdir -p .ai-test
          agy -p "Create exactly .ai-test/AGY_OK.txt in the current workspace with content AGY_OK. Do not use scratch directories." \
            --add-dir "$GITHUB_WORKSPACE" \
            --output-format json
          test -f .ai-test/AGY_OK.txt
          test "$(cat .ai-test/AGY_OK.txt)" = "AGY_OK"

      - name: Comment on Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --body "✅ AI Engineering Team entrypoint passed. Self-hosted runner connected and AGY successfully edited the develop checkout workspace."

      - name: Manual dispatch result
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Manual AGY entrypoint smoke test passed for Issue #$ISSUE_NUMBER."
